<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta name="theme-color" content="#000000" />
    <meta
      name="robots"
      content="index, follow"
    />

    <!-- ===================================== -->
    <!-- SEO TITLE -->
    <!-- ===================================== -->

    <title>
      SpeedLix - Real-Time GPS Speedometer & Live Speed Tracker
    </title>

    <!-- ===================================== -->
    <!-- SEO DESCRIPTION -->
    <!-- ===================================== -->

    <meta
      name="description"
      content="SpeedLix is a real-time GPS speedometer web app for accurate live speed tracking, telemetry, and trip monitoring."
    />

    <!-- ===================================== -->
    <!-- SEO KEYWORDS -->
    <!-- ===================================== -->

    <meta
      name="keywords"
      content="
        gps speedometer,
        live speed tracker,
        real-time speedometer,
        GPS tracking,
        speed tracking app,
        live GPS speed,
        online speedometer
      "
    />

    <!-- ===================================== -->
    <!-- AUTHOR -->
    <!-- ===================================== -->

    <meta
      name="author"
      content="Om Nakrani"
    />

    <!-- ===================================== -->
    <!-- WEBSITE NAME -->
    <!-- ===================================== -->

    <meta
      name="application-name"
      content="SpeedLix"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="SpeedLix"
    />

    <!-- ===================================== -->
    <!-- GOOGLE VERIFICATION -->
    <!-- ===================================== -->

    <meta
      name="google-site-verification"
      content="11bpScKG72MZADwLlSvLmWgamZJjRQc7WC_7wVSRUDw"
    />
    
    <!-- ===================================== -->
    <!-- BING VERIFICATION -->
    <!-- ===================================== -->

    <meta
      name="msvalidate.01"
      content="5BCDAC85D10F695101104CD8023E7F53"
    />

    <!-- ===================================== -->
    <!-- FAVICON -->
    <!-- ===================================== -->

    <link
      rel="icon"
      href="%PUBLIC_URL%/favicon.ico"
    />

    <!-- ===================================== -->
    <!-- APPLE ICON -->
    <!-- ===================================== -->

    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo192.png"
    />

    <!-- ===================================== -->
    <!-- MANIFEST -->
    <!-- ===================================== -->

    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- ===================================== -->
    <!-- OPEN GRAPH TAGS -->
    <!-- ===================================== -->

    <meta
      property="og:site_name"
      content="SpeedLix"
    />

    <meta
      property="og:title"
      content="
        SpeedLix - Real-Time GPS Speedometer
      "
    />

    <meta
      property="og:description"
      content="Track your live speed accurately using GPS technology with SpeedLix."
    />

    <meta
      property="og:url"
      content="https://speed-lix.vercel.app"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:image"
      content="https://speed-lix.vercel.app/logo512.png"
    />

    <!-- ===================================== -->
    <!-- TWITTER TAGS -->
    <!-- ===================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="
        SpeedLix - Real-Time GPS Speedometer
      "
    />

    <meta
      name="twitter:description"
      content="Accurate live GPS speed tracking directly in your browser."
    />

    <meta
      name="twitter:image"
      content="https://speed-lix.vercel.app/logo512.png"
    />

    <!-- ===================================== -->
    <!-- STRUCTURED DATA -->
    <!-- ===================================== -->

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SpeedLix",
      "url": "https://speed-lix.vercel.app",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Web Browser",
      "author": {
        "@type": "Person",
        "name": "Om Nakrani"
      },
      "description": "Real-time GPS speedometer with accurate live tracking."
    }
    </script>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>
  </body>
</html>
